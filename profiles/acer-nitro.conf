# Acer Nitro profile. Applied only with: ./install.sh --profile acer-nitro
# Hyprland output names and modes observed on the source machine.
monitor = HDMI-A-1,1920x1080@180,0x0,1
monitor = eDP-1,1920x1080@144,1920x0,1
workspace = 1,monitor:HDMI-A-1
workspace = 2,monitor:HDMI-A-1
workspace = 3,monitor:HDMI-A-1
workspace = 4,monitor:eDP-1
workspace = 5,monitor:eDP-1

# Optional package for this hardware profile; never installed by the generic flow.
optional_aur_package = acer-wmi-battery-dkms

